# Build the site and deploy it to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Build (but do not deploy) on PRs, so a broken build is caught before merge
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build CSS
        run: npm run build:css
      # public/css/style.css is generated, not committed. If the build ever silently
      # produces nothing, fail here rather than deploying a styleless fambod.com.
      - name: Verify CSS was built
        run: |
          test -f public/css/style.css || { echo "::error::public/css/style.css was not generated"; exit 1; }
          size=$(wc -c < public/css/style.css)
          echo "Built CSS: ${size} bytes"
          [ "$size" -gt 10000 ] || { echo "::error::public/css/style.css is only ${size} bytes - build looks broken"; exit 1; }
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'

  # Separate job so PR builds never touch the github-pages environment,
  # which only allows deployments from main.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
